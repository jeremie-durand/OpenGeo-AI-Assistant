services:
  frontend:
    build:
      context: ./opengeo-ai-assistant/web-ui
      dockerfile: Dockerfile
    container_name: opengeo-ai-assistant--frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./opengeo-ai-assistant/
      dockerfile: Dockerfile
    container_name: opengeo-ai-assistant-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CORS_ORIGINS=http://localhost:3000
    restart: unless-stopped
