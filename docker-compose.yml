services:
  frontend:
    build:
      context: ./opengeo-ai-assistant/web-ui
      dockerfile: Dockerfile
    container_name: opengeo-ai-assistant-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

  backend:
    build:
      context: ./opengeo-ai-assistant/
      dockerfile: Dockerfile
    container_name: opengeo-ai-assistant-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CORS_ORIGINS=${FRONTEND_URL:-http://localhost:3000}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
